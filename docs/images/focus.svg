<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="One game, one platform, one online service: Super Mario Maker 2 3.0.3, Windows, OpenCourse World">
  <rect width="1000" height="260" rx="18" fill="#1b1f3b"/>
  <text x="500" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">Does one thing, and does it well.</text>

  <!-- card 1 -->
  <rect x="40" y="70" width="280" height="150" rx="14" fill="#e60012"/>
  <text x="180" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#ffd6d9">ONE GAME</text>
  <!-- ? block icon -->
  <rect x="152" y="120" width="56" height="56" fill="#fbd000" stroke="#7a4a00" stroke-width="4"/>
  <text x="180" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#fff" stroke="#7a4a00" stroke-width="2" paint-order="stroke">?</text>
  <text x="180" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Super Mario Maker 2 (3.0.3)</text>

  <!-- card 2 -->
  <rect x="360" y="70" width="280" height="150" rx="14" fill="#0b6fd1"/>
  <text x="500" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#cfe6ff">ONE PLATFORM</text>
  <!-- window icon -->
  <g transform="translate(472 120)">
    <rect x="0" y="0" width="26" height="26" fill="#fff"/>
    <rect x="30" y="0" width="26" height="26" fill="#fff"/>
    <rect x="0" y="30" width="26" height="26" fill="#fff"/>
    <rect x="30" y="30" width="26" height="26" fill="#fff"/>
  </g>
  <text x="500" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Windows 10 and 11</text>

  <!-- card 3 -->
  <rect x="680" y="70" width="280" height="150" rx="14" fill="#1f9d46"/>
  <text x="820" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#d3f5dd">ONE ONLINE SERVICE</text>
  <!-- globe icon -->
  <g transform="translate(820 148)" fill="none" stroke="#fff" stroke-width="4">
    <circle r="28"/>
    <ellipse rx="12" ry="28"/>
    <path d="M-28 0H28M-24 -14H24M-24 14H24"/>
  </g>
  <text x="820" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">OpenCourse World</text>
</svg>
